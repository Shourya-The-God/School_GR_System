<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - School GR System</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/students.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🏫</div>
        <div>
          <h2>School GR System</h2>
          <p>Admin Portal</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="/students.html" class="nav-link">👥 General Register</a>
        <a href="/import.html" class="nav-link">📄 OCR Import</a>
        <a href="/transfers.html" class="nav-link">📜 Transfer Certs</a>
        <a href="/audit.html" class="nav-link active">🛡️ Audit Logs</a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-name" id="current-user-name">Loading...</span>
          <span class="user-role" id="current-user-role">-</span>
        </div>
        <button id="btn-logout" class="btn btn-secondary btn-sm">Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-bar">
        <h1>System Audit & Compliance Trail</h1>
      </header>

      <div class="page-body">
        <div class="card">
          <!-- Toolbar -->
          <div class="table-toolbar">
            <div class="search-input-group">
              <span class="search-icon">🔍</span>
              <input type="text" id="search-audit-input" class="search-input" placeholder="Search by Action, User, Entity...">
            </div>

            <div class="filter-group">
              <select id="filter-audit-action" class="form-control" style="width: 200px;">
                <option value="">All Actions</option>
                <option value="CREATE_STUDENT">CREATE_STUDENT</option>
                <option value="UPDATE_STUDENT_GR">UPDATE_STUDENT_GR</option>
                <option value="ISSUE_TRANSFER_CERTIFICATE">ISSUE_TRANSFER_CERTIFICATE</option>
                <option value="VERIFY_OCR_AND_CREATE_STUDENT">VERIFY_OCR_AND_CREATE_STUDENT</option>
                <option value="USER_LOGIN">USER_LOGIN</option>
              </select>
            </div>
          </div>

          <!-- Audit Table -->
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>User & Role</th>
                  <th>Action</th>
                  <th>Entity Reference</th>
                  <th>IP Address</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="audit-tbody">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading audit logs...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination">
            <span class="pagination-info" id="audit-pagination-info">-</span>
            <div class="pagination-controls" id="audit-pagination-controls"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Audit Log Detail Modal -->
  <div class="modal-backdrop" id="audit-detail-modal">
    <div class="modal-content" style="max-width: 650px;">
      <div class="card-header" style="margin-bottom: 16px;">
        <h3>Audit Record Inspection</h3>
        <button class="btn btn-secondary btn-sm" id="btn-close-audit-modal">✕</button>
      </div>

      <pre id="audit-detail-json" style="background: #0f172a; color: #38bdf8; padding: 16px; border-radius: var(--radius-md); font-family: monospace; font-size: 0.85rem; max-height: 400px; overflow: auto;"></pre>
    </div>
  </div>

  <script type="module" src="/js/audit.js"></script>
</body>
</html>
