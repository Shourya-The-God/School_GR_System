<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const token = localStorage.getItem('gr_auth_token');
    if (token) {
      window.location.href = '/dashboard.html';
    } else {
      window.location.href = '/login.html';
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">Redirecting to School GR Portal...</p>
</body>
</html>
