<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School General Register (GR) System</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg, 12px);
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg, 0 10px 25px rgba(0, 0, 0, 0.15));
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-header .school-logo {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .login-header h1 {
      font-size: 1.4rem;
      color: var(--text-main, #1e293b);
      font-weight: 700;
    }
    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted, #64748b);
      margin-top: 4px;
    }
    .demo-credentials {
      margin-top: 24px;
      padding: 12px;
      background: var(--primary-light, #eff6ff);
      border: 1px solid var(--primary-border, #bfdbfe);
      border-radius: var(--radius-md, 8px);
      font-size: 0.8rem;
      color: var(--primary, #1d4ed8);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="school-logo">🏫</div>
        <h1>School GR & Student Portal</h1>
        <p>Digital General Register Management & OCR Verification</p>
      </div>

      <form id="form-login">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label required" for="username">Username or Email</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label required" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
          Sign In to Portal
        </button>
      </form>

      <div class="demo-credentials">
        <strong>Default Admin Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>Admin@12345</code><br>
        <span style="font-size: 0.75rem; color: var(--text-muted);">(Clerk: <code>clerk</code> / <code>Admin@12345</code>)</span>
      </div>
    </div>
  </div>

  <script type="module">
    // Fixed: Use relative './js/auth.js' (or './auth.js' if in the same folder)
    import { initAuth, login } from './js/auth.js';

    // Auto check if already logged in
    initAuth();

    const form = document.getElementById('form-login');
    const submitBtn = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Prevents default GET submit & page reload

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;

      try {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Signing in...';
        await login(u, p);
      } catch (err) {
        console.error('Login failed:', err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
