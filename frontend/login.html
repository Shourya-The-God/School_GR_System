<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School General Register (GR) System</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header .school-logo {
      font-size: 42px;
      margin-bottom: 8px;
    }
    .login-header h1 {
      font-size: 1.4rem;
      color: #1e293b;
      margin: 0;
      font-weight: 700;
    }
    .login-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    .form-control {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .error-box {
      display: none;
      padding: 10px 14px;
      background: #fee2e2;
      border: 1px solid #f87171;
      border-radius: 6px;
      color: #b91c1c;
      font-size: 0.85rem;
      margin-bottom: 16px;
      word-break: break-word;
    }
    .demo-credentials {
      margin-top: 24px;
      padding: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="school-logo">🏫</div>
        <h1>School GR & Student Portal</h1>
        <p>Digital General Register Management</p>
      </div>

      <div id="error-box" class="error-box"></div>

      <form id="form-login" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="button" id="btn-submit" class="btn btn-primary">
          Sign In to Portal
        </button>
      </form>

      <div class="demo-credentials">
        <strong>Default Admin Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>Admin@12345</code>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuth, login } from './js/auth.js';

    // Check if session already active
    initAuth();

    const submitBtn = document.getElementById('btn-submit');
    const uInput = document.getElementById('username');
    const pInput = document.getElementById('password');
    const errorBox = document.getElementById('error-box');

    function showError(msg) {
      errorBox.style.display = 'block';
      errorBox.innerHTML = msg;
    }

    async function handleLogin() {
      errorBox.style.display = 'none';
      const u = uInput.value.trim();
      const p = pInput.value;

      if (!u || !p) {
        showError('Please enter both username and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Connecting to Render Backend...';

      try {
        await login(u, p);
      } catch (err) {
        showError('<b>Login Failed:</b> ' + (err.message || 'Check server connection'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In to Portal';
      }
    }

    submitBtn.addEventListener('click', handleLogin);
    pInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
